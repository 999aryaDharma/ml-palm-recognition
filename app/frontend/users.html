<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users — PalmID</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/ux.css" />
    <link rel="stylesheet" href="css/pages/users.css" />
  </head>

  <body class="app-body">
    <!-- Navbar -->
    <header class="app-navbar" role="banner"></header>

    <!-- Main -->
    <main class="app-main">
      <div class="container-lg users-page">
        <div
          class="page-header"
          style="
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
          "
        >
          <div>
            <p class="eyebrow">USER MANAGEMENT</p>
            <h1>Daftar Pengguna</h1>
            <p>
              Kelola data biometrik pengguna yang telah terdaftar di sistem.
            </p>
          </div>
          <div class="page-header-actions" style="margin-top: 0">
            <a href="enroll.html" class="btn btn--primary">
              + Tambah Pengguna
            </a>
          </div>
        </div>

        <!-- Search & Filter -->
        <section class="users-toolbar-card" aria-label="Pencarian pengguna">
          <label for="user-search" class="sr-only">Cari nama pengguna</label>
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input
              type="search"
              id="user-search"
              class="input input--search"
              placeholder="Cari nama pengguna..."
              autocomplete="off"
            />
          </div>
        </section>

        <!-- Users Grid -->
        <div id="users-grid" class="users-grid">
          <!-- Skeletons while loading -->
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-state-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <h3>Belum ada pengguna</h3>
          <p>
            Silakan daftarkan pengguna baru untuk mulai menggunakan sistem
            identifikasi telapak tangan.
          </p>
          <a
            href="enroll.html"
            class="btn btn--primary"
            style="margin-top: var(--space-4)"
            >Mulai Enrollment</a
          >
        </div>
      </div>
    </main>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <script type="module" src="js/pages/users.js"></script>
  </body>
</html>
