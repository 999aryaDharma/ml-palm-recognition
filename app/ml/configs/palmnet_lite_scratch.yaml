# PalmNet-Lite Scratch — Canonical Training Configuration
# Sesuai docs/03-training-and-artifacts.md §53
# Source of truth untuk experiment pertama (baseline).

run:
  seed: 42
  model_id: palmnet-lite-scratch

model:
  id: palmnet-lite-scratch
  architecture: PalmNetLite
  architecture_version: v1
  input_channels: 3
  input_size: 112
  embedding_dim: 128
  initialization: kaiming_random
  activation: prelu
  prelu_init: 0.25
  expansion_ratio: 2
  stem_channels: 32
  stage_channels: [32, 64, 96, 128]
  stage_repeats: [2, 3, 4, 2]
  projection_channels: 256
  spatial_aggregation: gdconv

dataset:
  name: Tongji Palmprint
  split_protocol: "400-train-cross-session-val-200-unseen-test"
  train_csv: data/splits/train.csv
  val_csv: data/splits/val.csv
  test_csv: data/splits/test.csv

augmentation:
  rotate_deg: 15
  crop_scale: [0.90, 1.00]
  crop_ratio: [0.85, 1.15]
  brightness: 0.25
  contrast: 0.25
  saturation: 0.15
  hue: 0.05
  blur_prob: 0.2
  noise_prob: 0.1

phase1:
  epochs: 40
  batch_size: 64
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.1
  warmup_epochs: 3
  scheduler: cosine
  min_lr: 0.000001
  grad_clip_norm: 5.0
  best_metric: val_accuracy
  gate_min_acc_pass: 0.70
  gate_min_acc_review: 0.50

phase2:
  epochs: 50
  batch_size: 64
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.0001
  arcface_margin: 0.30
  arcface_scale: 32.0
  margin_warmup_epochs: 8
  scheduler: cosine
  min_lr: 0.000001
  grad_clip_norm: 5.0
  best_metric: cosine_gap

evaluation:
  metric: cosine_similarity
  threshold_calibration: eer
  calibration_split: validation
  far_targets: [0.001, 0.0001]

paths:
  checkpoint_dir: checkpoints/palmnet-lite-scratch
  trained_logs_dir: artifacts/trained_logs/palmnet-lite-scratch
  artifact_dir: ../backend/ml/models/palmnet-lite-scratch/1.0.0
  artifact_version: "1.0.0"
